services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    # MySQL-compatible default collation, so exports import cleanly on MySQL hosts
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-admin}
      MARIADB_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:7-php8.3-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-admin}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-admin}
      WORDPRESS_DEBUG: ${WP_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        define('FS_METHOD', 'direct');
        // Follow the URL the site is opened from (localhost, VS Code tunnel, ngrok...)
        if (!empty($$_SERVER['HTTP_X_FORWARDED_HOST'])) {
          $$_SERVER['HTTP_HOST'] = trim(explode(',', $$_SERVER['HTTP_X_FORWARDED_HOST'])[0]);
        }
        if (!empty($$_SERVER['HTTP_HOST'])) {
          $$scheme = !empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off' ? 'https' : 'http';
          define('WP_HOME', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
        }
    volumes:
      - ./wordpress:/var/www/html
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  phpmyadmin:
    depends_on:
      db:
        condition: service_healthy
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 10240M

volumes:
  db_data:
